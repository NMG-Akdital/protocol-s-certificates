<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Protocol S Certificates</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth">
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <img src="/static/brand/logo-mark.svg" alt="" width="44" height="44">
      <div><b style="letter-spacing:.08em;color:#0E2240">PROTOCOL S</b><div class="muted" style="font-size:10px;letter-spacing:.22em">CERTIFICATE ADMINISTRATION</div></div>
    </div>
    <h1 style="font-size:22px">Sign in</h1>
    <p class="muted small" style="margin-top:0">Authorized staff only.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
