<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="pub"><main><div class="wrap">

  </div>
</div></main></div>
</body>
</html>
