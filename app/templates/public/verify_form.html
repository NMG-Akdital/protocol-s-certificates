{% extends "public/_base.html" %}
{% block content %}
<div class="result">
  <div class="body">
    <h1>Verify a certificate</h1>
    <p class="muted" style="margin-top:4px">Scan the QR code on the certificate, or enter the certificate ID printed on it.</p>
    <form method="get" action="/verify" class="lookup" style="margin-top:18px">
      <label for="cid" class="sr" style="position:absolute;left:-9999px">Certificate ID</label>
      <input id="cid" type="text" name="id" placeholder="PS-2026-000001" autocomplete="off" required pattern="[A-Za-z0-9]{1,10}-[0-9]{4}-[0-9]{6}" inputmode="text">
      <button class="btn" type="submit">Verify</button>
    </form>
    <p class="small muted" style="margin-top:14px">Format: PS-YYYY-NNNNNN</p>
  </div>
</div>
{% endblock %}
