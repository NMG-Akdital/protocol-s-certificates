# Render Blueprint (free plan): New → Blueprint → select this repository.
# The free web service has no persistent disk, so ALL data lives in the external
# PostgreSQL database given in DATABASE_URL (e.g. a free Neon database).
# Archived PDFs are regenerated automatically from the signed records.
# Secret keys are generated by Render — never typed or stored in the code.
services:
  - type: web
    name: protocol-s-verify
    runtime: docker
    plan: free               # sleeps after 15 min idle; first scan then takes ~30–50 s
    region: frankfurt        # closest Render region to Saudi Arabia
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: WEB_CONCURRENCY
        value: "1"           # free instances have 512 MB RAM
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string when Render asks
      - key: SECRET_KEY
        generateValue: true
      - key: CERT_SIGNING_KEY
        generateValue: true  # never change after issuing certificates
      - key: SETUP_TOKEN
        generateValue: true  # used once on /setup to create the first admin
      # PUBLIC_BASE_URL defaults to https://<service>.onrender.com
