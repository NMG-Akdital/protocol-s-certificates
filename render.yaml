# Render Blueprint: New → Blueprint → select this repository.
# Secret keys are generated by Render (never typed or stored in the code).
services:
  - type: web
    name: protocol-s-verify
    runtime: docker
    plan: starter            # paid plan is required for the persistent disk
    region: frankfurt        # closest Render region to Saudi Arabia
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: protocol-s-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SECRET_KEY
        generateValue: true
      - key: CERT_SIGNING_KEY
        generateValue: true     # never change after issuing certificates
      - key: SETUP_TOKEN
        generateValue: true     # used once on /setup to create the first admin
      # PUBLIC_BASE_URL defaults to https://<service>.onrender.com.
      # Set it to https://verify.yourdomain.com only if you connect a custom domain
      # BEFORE issuing real certificates.
